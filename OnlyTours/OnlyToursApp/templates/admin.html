<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% load static %}

    <link rel="stylesheet" href="{% static 'css/vars.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        a,
        button,
        input,
        select,
        h1,
        h2,
        h3,
        h4,
        h5,
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border: none;
            text-decoration: none;
            background: none;
            -webkit-font-smoothing: antialiased;
        }

        menu,
        ol,
        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }
    </style>

    <title>Admin Dashboard</title>
</head>

<body>

    <div class="admin-dashboard">

        <div class="desktop">

            <div class="dashboard">
                Dashboard
            </div>

            <div class="welcome-admin">
                WELCOME ADMIN!
            </div>

            <div class="onlytourz">
                <span>
                    <span class="onlytourz-span">ONLYTOURZ</span>
                    <span class="onlytourz-span2"></span>
                </span>
            </div>

            <div class="create-admin">
                Create Admin
            </div>

            <div class="manage-applications">
                Manage Applications
            </div>

            <div class="manage-places">
                Manage Places of Interest
            </div>

            <div class="reports">
                Reports
            </div>

            <div class="view-tour-guides">
                View tour guides
            </div>

            <div class="booking-history">
                Booking History
            </div>

            <div class="manage-reviews">
                Manage reviews
            </div>

            <div class="manage-accounts">
                Manage accounts
            </div>

            <img class="admin-image"
                 src="{% static 'images/admin-image.png' %}"
                 alt="Admin Dashboard">

        </div>

    </div>

</body>

</html>
