{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Registration · OnlyTours</title>
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/customerReg.css' %}">
</head>
<body>
  <div class="customerreg-page site-brand-gradient">

    <a class="site-logo customerreg-logo" href="{% url 'OnlyToursApp:homepage' %}">
      <img src="{% static 'images/customerReg/image0.png' %}" alt="OnlyTours logo" />
      <span class="site-logo-text"><span class="script">Onlytourz</span></span>
    </a>

    <div class="customerreg-grid">
      <div class="customerreg-form-wrap">
        <p class="eyebrow">CREATE AN ACCOUNT</p>
        <h1>Welcome new customer!</h1>

        <form class="customerreg-form" method="post" action="{% url 'OnlyToursApp:customerReg' %}">
          {% csrf_token %}

          <div class="field field-full">
            <label for="email">Email Address</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" required>
          </div>

          <div class="field">
            <label for="first_name">First Name</label>
            <input id="first_name" name="first_name" type="text" placeholder="First name" required>
          </div>

          <div class="field">
            <label for="last_name">Last Name</label>
            <input id="last_name" name="last_name" type="text" placeholder="Last name" required>
          </div>

          <div class="field">
            <label for="country">Country of Origin</label>
            <div class="select-wrap">
              <select id="country" name="country" required>
                <option value="" selected disabled>Select your country</option>
                <option value="MU">Mauritius</option>
                <option value="FR">France</option>
                <option value="UK">United Kingdom</option>
                <option value="ZA">South Africa</option>
                <option value="IN">India</option>
                <option value="US">United States</option>
                <option value="OTHER">Other</option>
              </select>
              <img class="select-chevron" src="{% static 'images/customerReg/rectangle-170.svg' %}" alt="">
            </div>
          </div>

          <div class="field">
            <label for="phone">Phone Number</label>
            <div class="select-wrap">
              <input id="phone" name="phone" type="tel" placeholder="+230 5xxx xxxx" required>
              <img class="select-chevron" src="{% static 'images/customerReg/rectangle-240.svg' %}" alt="">
            </div>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Create a password" required minlength="8">
          </div>

          <div class="field">
            <label for="confirm_password">Confirm Password</label>
            <input id="confirm_password" name="confirm_password" type="password" placeholder="Confirm your password" required minlength="8">
          </div>

          <div class="field field-full">
            <button type="submit" class="btn-accent">Create Account</button>
          </div>
        </form>
      </div>

      <a class="customerreg-hero-image" href="{% url 'OnlyToursApp:homepage' %}" aria-label="OnlyTours — back to home">
        <img src="{% static 'images/customerReg/_5277724560626194-10.png' %}" alt="Scenic views of Mauritius" />
      </a>
    </div>
  </div>
</body>
</html>
